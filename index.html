<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="俊俊菌的个人博客 - 技术 · 游戏 · 生活">
    <title>俊俊菌的博客 | CatFoxJun</title>
    <link rel="icon" type="image/svg+xml" href="Toxiang.svg">
    <link rel="stylesheet" href="style.css">
    <script src="marked.min.js"></script>
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<nav class="topnav">
    <a class="topnav-logo" href="#" onclick="switchView('home');return false;">俊俊菌的博客</a>
    <a class="topnav-link active" data-view="home" href="#" onclick="switchView('home');return false;">首页</a>
    <a class="topnav-link" data-view="posts" href="#" onclick="switchView('posts');return false;">文章</a>
    <a class="topnav-link" data-view="projects" href="#" onclick="switchView('projects');return false;">项目</a>
    <a class="topnav-link" data-view="honors" href="#" onclick="switchView('honors');return false;">荣誉墙</a>
    <a class="topnav-link" data-view="repos" href="#" onclick="switchView('repos');return false;">仓库</a>
    <div class="topnav-spacer"></div>
    <div class="topnav-search">
        <input type="text" id="blogSearch" placeholder="搜索文章... (Ctrl+F)" autocomplete="off">
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">白日</button>
    <div class="bg-menu">
        <button class="theme-toggle bg-menu-btn" id="bgMenuBtn" title="自定义背景" aria-label="自定义背景"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        <div class="bg-panel" id="bgPanel" style="display:none;">
            <span class="bg-label">预设背景</span>
            <div class="bg-presets" id="bgPresets"></div>
            <div class="bg-actions">
                <button id="bgImport">导入</button>
                <button id="bgClear">清除</button>
            </div>
            <input type="file" id="bgFile" accept="image/*" style="display:none;">
        </div>
    </div>
</nav>

<!-- ===== 主内容区 ===== -->
<canvas id="bgParticles"></canvas>
<main class="app-body">

    <!-- ========== 首页：三栏连窗 ========== -->
    <section class="page-view active" id="homeView">
        <div class="home-layout">

            <!-- 左栏：个人主页 -->
            <aside class="pane pane-profile">
                <div class="profile-avatar">
                    <img id="profileAvatar" src="Toxiang.jpg" alt="头像">
                </div>
                <div class="profile-links" id="profileLinks"></div>
                <h1 class="profile-name" id="profileName">俊俊菌</h1>
                <p class="profile-username" id="profileUsername">CatFoxJun</p>
                <p class="profile-bio" id="profileBio"></p>
                <div class="profile-motto" id="profileMotto"></div>

                <!-- 音乐播放器 -->
                <div class="music-player" id="musicPlayer" style="display:none;">
                    <img class="music-cover" id="musicCover" alt="音乐封面">
                    <div class="music-body">
                        <div class="music-title" id="musicTitle"></div>
                        <div class="music-progress"><div class="music-progress-bar" id="musicProgressBar"></div></div>
                        <div class="music-controls">
                            <button class="music-btn" id="musicPrev" aria-label="上一首"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
                            <button class="music-btn music-btn-play" id="musicPlay" aria-label="播放"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
                            <button class="music-btn" id="musicNext" aria-label="下一首"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
                        </div>
                    </div>
                    <audio id="musicAudio"></audio>
                </div>

                <!-- 时钟 -->
                <div class="clock-panel" id="clockPanel">
                    <svg class="clock-face" viewBox="0 0 100 100" width="120" height="120">
                        <circle cx="50" cy="50" r="46" class="clock-ring"/>
                        <line id="clockHour" x1="50" y1="50" x2="50" y2="22" class="clock-hand clock-hour"/>
                        <line id="clockMin" x1="50" y1="50" x2="50" y2="10" class="clock-hand clock-min"/>
                        <circle cx="50" cy="50" r="3" class="clock-center"/>
                    </svg>
                    <div class="clock-time" id="clockTime">--:--:--</div>
                </div>
            </aside>

            <!-- 中栏：自述文件主展示（类 GitHub 仓库 README） -->
            <div class="pane pane-readme">
                <div class="repo-header">
                    <span class="repo-path">
                        <span class="repo-owner" id="repoOwner">CatFoxJun</span>
                        <span class="repo-sep">/</span>
                        <span class="repo-file">HOME.md</span>
                    </span>
                    <span class="repo-badge">Public</span>
                </div>
                <div class="readme-box">
                    <div class="readme-head">HOME.md</div>
                    <div class="markdown-body readme-content" id="readmeContent">
                        <p class="loading-text">正在加载 HOME.md ...</p>
                    </div>
                </div>
            </div>

            <!-- 右栏：技能墙 + 文档目录 -->
            <aside class="pane pane-side">
                <section class="side-section">
                    <h2 class="pane-title">技能墙</h2>
                    <div class="skill-wall" id="skillWall"></div>
                </section>
                <section class="side-section">
                    <h2 class="pane-title">文档 <span class="pane-title-count" id="docCount"></span></h2>
                    <div class="doc-list" id="docList"></div>
                </section>
            </aside>

        </div>
    </section>

    <!-- ========== 文章列表 ========== -->
    <section class="page-view" id="postsView">
        <div class="category-pills" id="categoryPills"></div>
        <div class="post-list" id="postGrid"></div>
        <div class="post-empty" id="postEmpty" style="display:none;">
            <p>没有找到匹配的文章</p>
            <span>试试其他关键词？</span>
        </div>
    </section>

    <!-- ========== 项目 ========== -->
    <section class="page-view" id="projectsView">
        <input type="text" class="page-search" id="projectSearch" placeholder="搜索项目..." autocomplete="off">
        <div class="category-pills" id="projectPills"></div>
        <div class="pinned-grid" id="pinnedGrid"></div>
    </section>

    <!-- ========== 荣誉墙 ========== -->
    <section class="page-view" id="honorsView">
        <div class="honors-list" id="honorsList"></div>
    </section>

    <!-- ========== 仓库 ========== -->
    <section class="page-view" id="reposView">
        <input type="text" class="page-search" id="repoSearch" placeholder="搜索仓库..." autocomplete="off">
        <div class="pinned-grid" id="reposGrid"><span class="loading-text">正在加载仓库...</span></div>
    </section>

    <!-- ========== 文章详情 ========== -->
    <section class="page-view" id="articleView">
        <button class="back-btn" onclick="switchView('posts')">&larr; 返回文章列表</button>
        <article class="article-card">
            <header class="article-header">
                <span class="article-cat-badge" id="articleCat"></span>
                <h1 class="article-title" id="articleTitle"></h1>
                <div class="article-meta">
                    <span id="articleDate"></span>
                </div>
                <div class="article-tags" id="articleTags"></div>
            </header>
            <div class="article-body markdown-body" id="articleContent"></div>
            <footer class="article-footer">
                <button class="article-nav-btn" id="prevPost" onclick="navigatePost(-1)" disabled>&larr; 上一篇</button>
                <button class="article-nav-btn" id="nextPost" onclick="navigatePost(1)" disabled>下一篇 &rarr;</button>
            </footer>
        </article>
    </section>

</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
    <span class="lightbox-title" id="lightboxTitle"></span>
</div>

<script src="script.js"></script>
</body>
</html>
